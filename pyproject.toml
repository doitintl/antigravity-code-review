[project]
name = "antigravity-code-review"
version = "0.0.1"
description = "AI pull request reviewer with per-PR cost tracking, built on the Google Antigravity SDK"
requires-python = ">=3.10"
dependencies = [
    # Pinned exactly: a 0.1.x SDK shipping a compiled runtime binary. Behaviour
    # has already diverged from its documentation more than once.
    "google-antigravity==0.1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antigravity_code_review"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/antigravity_code_review"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Vendored verbatim from the SDK at tag v0.1.12 and pinned by git blob SHA in
# probe/probe_example_parity.py. Formatting them would break that check and the
# provenance it exists to prove, so they are not ours to lint.
extend-exclude = ["probe/sdk_examples"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
