# M0 exit criterion: prove Workload Identity Federation -> ADC -> Vertex works
# headlessly, with no API key anywhere.
#
# Both published Antigravity reviewers authenticate with an API key secret, so
# this path is demonstrated nowhere. Everything else in the project is built on
# the assumption that it works.

name: M0 — Prove the foundation

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/antigravity-sdk-plan-review-**"
    paths:
      - ".github/workflows/m0-foundation.yml"
      - "src/**"
      - "pyproject.toml"

permissions:
  id-token: write   # mint the OIDC token WIF exchanges. Without this, nothing works.
  contents: read

concurrency:
  group: m0-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLOUD_PROJECT: sascha-playground-doit
      GOOGLE_CLOUD_LOCATION: global

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Refuse to run with a key present
        # The probe asserts this too. Failing here as well means a key added by
        # accident stops the job before it can reach Vertex and quietly succeed
        # for the wrong reason.
        run: |
          for v in GEMINI_API_KEY GOOGLE_API_KEY GOOGLE_APPLICATION_CREDENTIALS; do
            if [ -n "${!v:-}" ]; then
              echo "::error::$v is set. This workflow must prove keyless auth."
              exit 1
            fi
          done
          echo "No credential-shaped variables present."

      - id: auth
        name: Authenticate to Google Cloud (WIF, no key)
        uses: google-github-actions/auth@140bb5113ffb6b65a7e9b937a81fa96cf5064462 # v2.1.11
        with:
          workload_identity_provider: projects/234439745674/locations/global/workloadIdentityPools/github-pool/providers/agy-code-review
          service_account: agy-code-review@sascha-playground-doit.iam.gserviceaccount.com

      - uses: astral-sh/setup-uv@f94ec6bedd8674c4426838e6b50417d36b6ab231 # v5.3.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install the pinned SDK
        # 0.1.12 publishes manylinux_2_17_x86_64, so ubuntu-latest resolves a
        # wheel rather than building the compiled runtime from source.
        run: |
          uv venv
          uv pip install -e .
          uv run python -c "import google.antigravity, sys; print('SDK import OK on', sys.version.split()[0])"

      - name: Prove it
        run: uv run python -m antigravity_code_review.m0_probe
